name: 发布 .plasmoid

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包
        run: ./scripts/build-package.sh

      - name: 建 Release 并上传部件包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.plasmoid
          generate_release_notes: true
          body: |
            安装方式任选其一：

            1. 下载下面的 `.plasmoid` 文件，然后
               ```
               kpackagetool6 --type Plasma/Applet --install <文件名>.plasmoid
               ```
            2. 或者 `git clone` 仓库后运行 `./scripts/install.sh`

            安装后在面板上右键 → 添加部件 → 搜索「农历时钟」。
